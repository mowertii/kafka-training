services:
  # ============================================================
  # KAFKA (KRaft mode)
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka-training-broker
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9094,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9094,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ============================================================
  # POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: kafka-training-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: kafkademo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d kafkademo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ============================================================
  # SCHEMA REGISTRY (для HW6 Avro + HW7 Connect)
  # ============================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: kafka-training-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:19092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_DEBUG: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 30           # 👈 УВЕЛИЧИТЬ
      start_period: 180s    # 👈 УВЕЛИЧИТЬ с 90 до 180
    profiles: ["hw6", "hw7"]

  # ============================================================
  # HW6 — SCHEMA REGISTRY + AVRO
  # ============================================================
  hw6-app:
    build:
      context: .
      dockerfile: homework-6-schema-registry/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JDBC_URL: jdbc:postgresql://postgres:5432/kafkademo
      JDBC_USER: demo
      JDBC_PASSWORD: demo
    profiles: ["hw6"]
    stdin_open: false
    tty: false

  # ============================================================
  # HW7 — CONNECT (заготовка)
  # ============================================================
  hw7-app:
    build:
      context: .
      dockerfile: homework-7-connect/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
    profiles: ["hw7"]

  # ============================================================
  # HW8 — STREAMS (заготовка)
  # ============================================================
  hw8-app:
    build:
      context: .
      dockerfile: homework-8-streams/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
    profiles: ["hw8"]

  # ============================================================
  # HW9 — K8S (заготовка)
  # ============================================================
  hw9-app:
    build:
      context: .
      dockerfile: homework-9-k8s/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
    profiles: ["hw9"]